<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLOW STATE - The Opposite of Boredom</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
            touch-action: none;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: none;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .word {
            position: absolute;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px currentColor;
            animation: wordPulse 2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes wordPulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .center-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 5;
            pointer-events: none;
            font-size: 18px;
            text-shadow: 0 0 20px rgba(255,255,255,0.8);
        }

        .pulse-circle {
            position: fixed;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.5);
            animation: ripple 2s ease-out infinite;
            pointer-events: none;
        }

        @keyframes ripple {
            0% {
                width: 20px;
                height: 20px;
                opacity: 1;
            }
            100% {
                width: 300px;
                height: 300px;
                opacity: 0;
            }
        }

        .counter {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 16px;
            z-index: 20;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        .inspiration {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            z-index: 20;
            text-align: center;
            max-width: 80%;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="overlay" id="overlay"></div>
    
    <div class="counter" id="counter">
        TIME FLOWS: 0.0s<br>
        PARTICLES: 0<br>
        ENERGY: ████████░░
    </div>

    <div class="inspiration" id="inspiration">
        Touch to create. Move to transform. Exist in flow.
    </div>

    <script>
        // THE OPPOSITE OF BOREDOM: PURE ENGAGEMENT AND FLOW
        
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const counter = document.getElementById('counter');
        const inspiration = document.getElementById('inspiration');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Particles represent the opposite of boredom's heaviness - lightness, movement, purpose
        const particles = [];
        const maxParticles = 3000;
        let time = 0;
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;
        let touching = false;
        let particleCount = 0;
        let colorShift = 0;

        // Words that embody the opposite of boredom
        const antiBoredWords = [
            'ALIVE', 'FLOW', 'ENGAGED', 'ELECTRIC', 'VIBRANT',
            'PRESENT', 'FASCINATED', 'ENERGIZED', 'ABSORBED',
            'PURPOSEFUL', 'STIMULATED', 'CAPTIVATED', 'FOCUSED',
            'CURIOUS', 'AWAKENED', 'INSPIRED', 'MOMENTUM',
            'VELOCITY', 'INTENSITY', 'CLARITY', 'MEANING'
        ];

        // Inspirational phrases - opposite of boredom's emptiness
        const phrases = [
            'Time dissolves when you\'re truly present',
            'Every moment bursts with possibility',
            'Your mind dances with endless discovery',
            'Lightness replaces heaviness',
            'Purpose flows through every action',
            'Engagement ignites every cell',
            'The future pulls you forward with excitement',
            'Restlessness transforms into directed energy',
            'Your hands create, your mind races with ideas',
            'Every sensation matters, every second counts',
            'You are fully here, completely alive'
        ];

        let currentPhrase = 0;

        class Particle {
            constructor(x, y, speed = 1) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * speed;
                this.vy = (Math.random() - 0.5) * speed;
                this.life = 1;
                this.decay = Math.random() * 0.005 + 0.002;
                this.size = Math.random() * 3 + 1;
                this.hue = (colorShift + Math.random() * 60) % 360;
                this.brightness = 50 + Math.random() * 50;
                this.trail = [];
            }

            update() {
                // Opposite of boredom's stagnation - constant purposeful movement
                this.trail.push({x: this.x, y: this.y, life: this.life});
                if (this.trail.length > 10) this.trail.shift();

                this.x += this.vx;
                this.y += this.vy;
                
                // Gravitational pull toward mouse - engagement, not aimlessness
                const dx = mouseX - this.x;
                const dy = mouseY - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 200) {
                    this.vx += (dx / dist) * 0.1;
                    this.vy += (dy / dist) * 0.1;
                }

                // Swirling motion - opposite of linear boredom
                const angle = Math.atan2(dy, dx);
                this.vx += Math.cos(angle + Math.PI / 2) * 0.05;
                this.vy += Math.sin(angle + Math.PI / 2) * 0.05;

                // Energy dampening
                this.vx *= 0.99;
                this.vy *= 0.99;

                this.life -= this.decay;
                this.hue = (this.hue + 0.5) % 360;
            }

            draw() {
                // Draw trail - showing path and purpose, not aimlessness
                ctx.globalAlpha = 0.3;
                for (let i = 0; i < this.trail.length - 1; i++) {
                    const t = this.trail[i];
                    const alpha = (i / this.trail.length) * this.life;
                    ctx.strokeStyle = `hsla(${this.hue}, 100%, ${this.brightness}%, ${alpha})`;
                    ctx.lineWidth = this.size * (i / this.trail.length);
                    ctx.beginPath();
                    ctx.moveTo(this.trail[i].x, this.trail[i].y);
                    ctx.lineTo(this.trail[i + 1].x, this.trail[i + 1].y);
                    ctx.stroke();
                }

                // Draw particle
                ctx.globalAlpha = this.life;
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2);
                gradient.addColorStop(0, `hsla(${this.hue}, 100%, ${this.brightness}%, 1)`);
                gradient.addColorStop(1, `hsla(${this.hue}, 100%, ${this.brightness}%, 0)`);
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                ctx.fill();

                // Glow effect - intensity, not dullness
                ctx.shadowBlur = 20;
                ctx.shadowColor = `hsla(${this.hue}, 100%, ${this.brightness}%, 0.8)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function createParticleBurst(x, y, count, speed) {
            for (let i = 0; i < count; i++) {
                if (particles.length < maxParticles) {
                    particles.push(new Particle(x, y, speed));
                    particleCount++;
                }
            }
        }

        function animate() {
            time += 0.016; // Opposite of slow time - time flows naturally
            colorShift += 0.5;

            // Fade previous frame slightly - creates motion trails
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Create ambient particles - opposite of emptiness
            if (Math.random() < 0.3 && particles.length < maxParticles * 0.8) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                particles.push(new Particle(x, y, 0.5));
            }

            // If touching, create burst - active creation, not passive consumption
            if (touching && particles.length < maxParticles) {
                createParticleBurst(mouseX, mouseY, 5, 2);
            }

            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                
                if (p.life <= 0 || p.x < -50 || p.x > canvas.width + 50 || 
                    p.y < -50 || p.y > canvas.height + 50) {
                    particles.splice(i, 1);
                } else {
                    p.draw();
                }
            }

            // Draw connecting lines between nearby particles - connection, not isolation
            ctx.globalAlpha = 0.2;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 100) {
                        const alpha = (1 - dist / 100) * 0.5;
                        ctx.strokeStyle = `hsla(${(particles[i].hue + particles[j].hue) / 2}, 100%, 70%, ${alpha})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }

            // Draw energy field around cursor - presence and impact
            ctx.globalAlpha = 0.3;
            const gradient = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 100);
            gradient.addColorStop(0, `hsla(${colorShift}, 100%, 70%, 0.3)`);
            gradient.addColorStop(1, `hsla(${colorShift}, 100%, 70%, 0)`);
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, 100, 0, Math.PI * 2);
            ctx.fill();

            ctx.globalAlpha = 1;

            // Update counter - showing progress, momentum, meaning
            const energy = Math.min(particles.length / maxParticles, 1);
            const energyBar = '█'.repeat(Math.floor(energy * 10)) + '░'.repeat(10 - Math.floor(energy * 10));
            counter.innerHTML = `
                TIME FLOWS: ${time.toFixed(1)}s<br>
                PARTICLES: ${particles.length}<br>
                ENERGY: ${energyBar}
            `;

            requestAnimationFrame(animate);
        }

        // Touch/Mouse events - interaction creates meaning
        canvas.addEventListener('mousedown', (e) => {
            touching = true;
            createParticleBurst(e.clientX, e.clientY, 30, 3);
        });

        canvas.addEventListener('mouseup', () => {
            touching = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touching = true;
            const touch = e.touches[0];
            mouseX = touch.clientX;
            mouseY = touch.clientY;
            createParticleBurst(mouseX, mouseY, 30, 3);
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            touching = false;
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            mouseX = touch.clientX;
            mouseY = touch.clientY;
        });

        // Spawn floating words - meaning, not meaninglessness
        function spawnWord() {
            const word = antiBoredWords[Math.floor(Math.random() * antiBoredWords.length)];
            const wordEl = document.createElement('div');
            wordEl.className = 'word';
            wordEl.textContent = word;
            wordEl.style.left = Math.random() * (window.innerWidth - 100) + 'px';
            wordEl.style.top = Math.random() * (window.innerHeight - 50) + 'px';
            wordEl.style.color = `hsl(${Math.random() * 360}, 100%, 70%)`;
            overlay.appendChild(wordEl);

            setTimeout(() => {
                wordEl.style.transition = 'opacity 1s';
                wordEl.style.opacity = '0';
                setTimeout(() => wordEl.remove(), 1000);
            }, 3000);
        }

        // Update inspiration text - purpose, not emptiness
        function updateInspiration() {
            inspiration.style.transition = 'opacity 0.5s';
            inspiration.style.opacity = '0';
            
            setTimeout(() => {
                currentPhrase = (currentPhrase + 1) % phrases.length;
                inspiration.textContent = phrases[currentPhrase];
                inspiration.style.opacity = '1';
            }, 500);
        }

        // Create ripple effect on touch - impact, not passivity
        function createRipple(x, y) {
            const ripple = document.createElement('div');
            ripple.className = 'pulse-circle';
            ripple.style.left = (x - 10) + 'px';
            ripple.style.top = (y - 10) + 'px';
            ripple.style.borderColor = `hsl(${colorShift}, 100%, 70%)`;
            overlay.appendChild(ripple);

            setTimeout(() => ripple.remove(), 2000);
        }

        canvas.addEventListener('click', (e) => {
            createRipple(e.clientX, e.clientY);
        });

        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            createRipple(touch.clientX, touch.clientY);
        });

        // Resize handler
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Start everything
        animate();
        setInterval(spawnWord, 2000);
        setInterval(updateInspiration, 5000);

        // Initial burst - immediate engagement
        setTimeout(() => {
            createParticleBurst(canvas.width / 2, canvas.height / 2, 100, 2);
        }, 100);

        // Background ambient creation
        setInterval(() => {
            if (particles.length < maxParticles * 0.5) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                createParticleBurst(x, y, 10, 1);
            }
        }, 1000);
    </script>
</body>
</html>
